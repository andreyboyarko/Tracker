xcassets:
  inputs:
    - Tracker/Assets.xcassets
  outputs:
    - templateName: swift5
      params:
        enumName: Asset
      output: Tracker/Generated/SwiftGen+Assets.swift

strings:
  inputs:
    - Tracker/en.lproj
    - Tracker/ru.lproj
  outputs:
    - templateName: structured-swift5
      params:
        enumName: L10n
      output: Tracker/Generated/SwiftGen+Strings.swift
