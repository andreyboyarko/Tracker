xcassets:
  inputs:
    - Tracker/Assets.xcassets
  outputs:
    - templateName: swift5
      params:
        enumName: Asset
      output: Generated/SwiftGen+Assets.swift

strings:
  inputs:
    - Tracker/Lokaliade/ru.lproj/Localizable.strings   
  outputs:
    - templateName: structured-swift5
      params:
        enumName: L10n
      output: Generated/SwiftGen+Strings.swift
