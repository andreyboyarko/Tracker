xcassets:
  inputs:
    - Assets.xcassets
  outputs:
    - templateName: swift5
      params:
        enumName: Asset
      output: Generated/SwiftGen+Assets.swift

strings:
  inputs:
    - Lokaliade   # берём всю папку; SwiftGen сам найдёт ru/en через фильтр по Localizable
  outputs:
    - templateName: structured-swift5
      params:
        enumName: L10n
      output: Generated/SwiftGen+Strings.swift
